name: consumer_app
description: Personal loan and motorcycle loan quotation app.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

# NOTE: versions were chosen without access to pub.dev. If `flutter pub get`
# reports a conflict, loosen the constraint that it names and re-run.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.9.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.0
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

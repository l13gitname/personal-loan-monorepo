services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-loan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_loan}
      POSTGRES_USER: ${POSTGRES_USER:-loan_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_this}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loan_app} -d ${POSTGRES_DB:-personal_loan}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

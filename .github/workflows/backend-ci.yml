name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: personal_loan_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d personal_loan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/personal_loan_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      # Throw-away CI database: apply committed migrations when they exist,
      # otherwise create the schema directly so the seed can still be checked.
      - name: Create schema
        run: |
          if [ -d prisma/migrations ]; then
            npx prisma migrate deploy
          else
            npx prisma db push --skip-generate
          fi

      - name: Seed (validates seed data against the schema)
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --passWithNoTests

name: Flutter CI

on:
  push:
    branches: [main]
    paths: ['apps/consumer_app/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['apps/consumer_app/**', '.github/workflows/flutter-ci.yml']

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/consumer_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # Freezed / json_serializable output is not committed.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test
